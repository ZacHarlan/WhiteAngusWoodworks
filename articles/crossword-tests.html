<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Puzzle Tests</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 2rem; }
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }
        .puzzle-section { margin-bottom: 2rem; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .puzzle-header { padding: 0.75rem 1rem; font-weight: bold; font-size: 1.1rem; }
        .puzzle-header.all-pass { background: #1b4332; }
        .puzzle-header.has-fail { background: #5c1a1a; }
        .test-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 1rem; border-top: 1px solid #2a2a2a; font-size: 0.9rem; }
        .test-row:nth-child(even) { background: #222; }
        .badge { display: inline-block; width: 20px; height: 20px; border-radius: 50%; text-align: center; line-height: 20px; font-size: 0.75rem; font-weight: bold; flex-shrink: 0; }
        .pass { background: #2d6a4f; color: #b7e4c7; }
        .fail { background: #a4161a; color: #ffd6d6; }
        .detail { color: #aaa; font-size: 0.8rem; margin-left: auto; }
        .summary { margin-bottom: 1.5rem; padding: 1rem; border-radius: 8px; font-size: 1.1rem; font-weight: bold; }
        .summary.all-pass { background: #1b4332; }
        .summary.has-fail { background: #5c1a1a; }
        .grid-visual { padding: 0.75rem 1rem; border-top: 1px solid #2a2a2a; }
        .grid-visual pre { font-size: 0.7rem; line-height: 1.3; color: #ccc; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Crossword Puzzle Validation</h1>
    <div id="summary"></div>
    <div id="results"></div>

    <script>
        // ── Puzzle data (mirrored from crossword.js) ──
        const puzzles = {
            'wood-glue-guide.html': {
                containerId: 'glue-crossword',
                size: 11,
                words: [
                    { answer: "REVERSIBLE", r: 0, c: 1, dir: "V", num: 1 },
                    { answer: "PVA", r: 2, c: 0, dir: "H", num: 2 },
                    { answer: "HIDE", r: 2, c: 4, dir: "V", num: 3 },
                    { answer: "SQUEEZEOUT", r: 5, c: 1, dir: "H", num: 4 },
                    { answer: "EPOXY", r: 9, c: 1, dir: "H", num: 5 }
                ]
            },
            'ai-woodworking-design.html': {
                containerId: 'ai-crossword',
                size: 11,
                words: [
                    { answer: "CNC", r: 3, c: 0, dir: "V", num: 1 },
                    { answer: "VECTOR", r: 4, c: 6, dir: "V", num: 2 },
                    { answer: "DESK", r: 4, c: 8, dir: "V", num: 3 },
                    { answer: "CANTILEVER", r: 5, c: 0, dir: "H", num: 4 },
                    { answer: "LAYOUT", r: 7, c: 1, dir: "H", num: 5 }
                ]
            },
            'dovetailed-tea-box.html': {
                containerId: 'tea-box-crossword',
                size: 11,
                words: [
                    { answer: "TEA", r: 0, c: 5, dir: "V", num: 1 },
                    { answer: "MALLET", r: 0, c: 7, dir: "V", num: 2 },
                    { answer: "DOVETAIL", r: 1, c: 2, dir: "H", num: 3 },
                    { answer: "PIANO", r: 3, c: 3, dir: "V", num: 4 },
                    { answer: "WALNUT", r: 5, c: 2, dir: "H", num: 5 }
                ]
            },
            'staining-guide.html': {
                containerId: 'staining-crossword',
                size: 11,
                words: [
                    { answer: "SANDING", r: 0, c: 8, dir: "V", num: 1 },
                    { answer: "MINERAL", r: 1, c: 3, dir: "H", num: 2 },
                    { answer: "BLOTCH", r: 4, c: 3, dir: "V", num: 3 },
                    { answer: "GRAIN", r: 4, c: 5, dir: "H", num: 4 },
                    { answer: "POPPING", r: 6, c: 2, dir: "H", num: 5 }
                ]
            },
            'box-joint-jig.html': {
                containerId: 'box-joint-crossword',
                size: 11,
                words: [
                    { answer: "KERF", r: 1, c: 4, dir: "H", num: 1 },
                    { answer: "FENCE", r: 1, c: 7, dir: "V", num: 2 },
                    { answer: "SPACING", r: 3, c: 2, dir: "H", num: 3 },
                    { answer: "BLADE", r: 5, c: 3, dir: "H", num: 4 },
                    { answer: "DADO", r: 5, c: 6, dir: "V", num: 5 }
                ]
            },
            'benefits-custom-furniture.html': {
                containerId: 'benefits-crossword',
                size: 11,
                words: [
                    { answer: "JOINERY", r: 0, c: 4, dir: "V", num: 1 },
                    { answer: "CUSTOM", r: 1, c: 0, dir: "H", num: 2 },
                    { answer: "WALNUT", r: 3, c: 1, dir: "H", num: 3 },
                    { answer: "HEIRLOOM", r: 5, c: 1, dir: "H", num: 4 },
                    { answer: "MAPLE", r: 5, c: 8, dir: "V", num: 5 }
                ]
            },
            'sandpaper-guide.html': {
                containerId: 'sandpaper-crossword',
                size: 11,
                words: [
                    { answer: "CERAMIC", r: 0, c: 5, dir: "V", num: 1 },
                    { answer: "GARNET", r: 1, c: 9, dir: "V", num: 2 },
                    { answer: "ORBITAL", r: 2, c: 4, dir: "H", num: 3 },
                    { answer: "GRIT", r: 4, c: 3, dir: "V", num: 4 },
                    { answer: "GRAIN", r: 5, c: 2, dir: "H", num: 5 }
                ]
            }
        };

        // ── Helpers ──
        function getCells(word) {
            const cells = [];
            for (let i = 0; i < word.answer.length; i++) {
                const row = word.dir === "H" ? word.r : word.r + i;
                const col = word.dir === "H" ? word.c + i : word.c;
                cells.push({ row, col, char: word.answer[i] });
            }
            return cells;
        }

        // ── Test functions (each returns { passed, message }) ──

        /** Every cell of every word must be within 0..size-1 */
        function testBounds(name, config) {
            const { size, words } = config;
            const oob = [];
            words.forEach(w => {
                getCells(w).forEach(({ row, col }) => {
                    if (row < 0 || row >= size || col < 0 || col >= size)
                        oob.push(`${w.answer}(${row},${col})`);
                });
            });
            return oob.length === 0
                ? { passed: true, message: 'All words fit within the grid' }
                : { passed: false, message: `Out of bounds: ${oob.join(', ')}` };
        }

        /** Where two words occupy the same cell, the letters must agree */
        function testNoConflicts(name, config) {
            const grid = {};
            const conflicts = [];
            config.words.forEach(w => {
                getCells(w).forEach(({ row, col, char }) => {
                    const key = `${row},${col}`;
                    if (grid[key] && grid[key].char !== char) {
                        conflicts.push(`(${row},${col}): "${grid[key].word}" has '${grid[key].char}' but "${w.answer}" has '${char}'`);
                    }
                    grid[key] = { char, word: w.answer };
                });
            });
            return conflicts.length === 0
                ? { passed: true, message: 'No letter conflicts' }
                : { passed: false, message: conflicts.join('; ') };
        }

        /** Every word must share at least one cell with another word */
        function testAllConnected(name, config) {
            const wordCellSets = config.words.map(w => {
                const set = new Set();
                getCells(w).forEach(({ row, col }) => set.add(`${row},${col}`));
                return { answer: w.answer, cells: set };
            });

            // Build adjacency based on shared cells
            const adj = config.words.map(() => new Set());
            for (let i = 0; i < wordCellSets.length; i++) {
                for (let j = i + 1; j < wordCellSets.length; j++) {
                    for (const cell of wordCellSets[i].cells) {
                        if (wordCellSets[j].cells.has(cell)) {
                            adj[i].add(j);
                            adj[j].add(i);
                            break;
                        }
                    }
                }
            }

            // BFS from word 0 — all words must be reachable
            const visited = new Set([0]);
            const queue = [0];
            while (queue.length) {
                const cur = queue.shift();
                for (const nb of adj[cur]) {
                    if (!visited.has(nb)) { visited.add(nb); queue.push(nb); }
                }
            }

            const isolated = config.words
                .filter((_, i) => !visited.has(i))
                .map(w => w.answer);

            return isolated.length === 0
                ? { passed: true, message: 'All words are connected' }
                : { passed: false, message: `Disconnected words: ${isolated.join(', ')}` };
        }

        /** No duplicate clue numbers */
        function testUniqueNumbers(name, config) {
            const seen = {};
            const dupes = [];
            config.words.forEach(w => {
                if (seen[w.num]) dupes.push(`#${w.num} used by both "${seen[w.num]}" and "${w.answer}"`);
                seen[w.num] = w.answer;
            });
            return dupes.length === 0
                ? { passed: true, message: 'All clue numbers are unique' }
                : { passed: false, message: dupes.join('; ') };
        }

        /** Numbers should follow top-to-bottom, left-to-right order */
        function testNumberOrder(name, config) {
            const entries = config.words.map(w => ({ num: w.num, r: w.r, c: w.c }));
            // Group by starting cell (two words can share a start cell)
            const cellMap = {};
            entries.forEach(e => {
                const key = `${e.r}-${e.c}`;
                if (!cellMap[key]) cellMap[key] = { r: e.r, c: e.c, nums: [] };
                cellMap[key].nums.push(e.num);
            });
            const cells = Object.values(cellMap)
                .map(c => ({ ...c, num: Math.min(...c.nums) }))
                .sort((a, b) => a.r - b.r || a.c - b.c);

            for (let i = 1; i < cells.length; i++) {
                if (cells[i].num < cells[i - 1].num) {
                    return { passed: false, message: `#${cells[i].num} at (${cells[i].r},${cells[i].c}) appears after #${cells[i - 1].num} at (${cells[i - 1].r},${cells[i - 1].c})` };
                }
            }
            return { passed: true, message: 'Clue numbers follow correct order' };
        }

        /** No unintended adjacency: horizontally adjacent cells must share an across word,
         *  vertically adjacent cells must share a down word */
        function testNoUnintendedAdjacency(name, config) {
            const { size, words } = config;
            const grid = {};
            const hMem = {};  // (r,c) → set of H-word indices
            const vMem = {};  // (r,c) → set of V-word indices

            words.forEach((w, idx) => {
                getCells(w).forEach(({ row, col, char }) => {
                    const key = `${row},${col}`;
                    grid[key] = char;
                    if (w.dir === 'H') {
                        if (!hMem[key]) hMem[key] = new Set();
                        hMem[key].add(idx);
                    } else {
                        if (!vMem[key]) vMem[key] = new Set();
                        vMem[key].add(idx);
                    }
                });
            });

            const violations = [];
            for (const key of Object.keys(grid)) {
                const [r, c] = key.split(',').map(Number);
                // Check right neighbor
                const rightKey = `${r},${c + 1}`;
                if (grid[rightKey]) {
                    const h1 = hMem[key] || new Set();
                    const h2 = hMem[rightKey] || new Set();
                    let shared = false;
                    for (const v of h1) { if (h2.has(v)) { shared = true; break; } }
                    if (!shared) violations.push(`(${r},${c})→(${r},${c+1}): no shared across word`);
                }
                // Check bottom neighbor
                const botKey = `${r + 1},${c}`;
                if (grid[botKey]) {
                    const v1 = vMem[key] || new Set();
                    const v2 = vMem[botKey] || new Set();
                    let shared = false;
                    for (const v of v1) { if (v2.has(v)) { shared = true; break; } }
                    if (!shared) violations.push(`(${r},${c})→(${r+1},${c}): no shared down word`);
                }
            }

            return violations.length === 0
                ? { passed: true, message: 'No unintended adjacency' }
                : { passed: false, message: violations.join('; ') };
        }

        /** Build an ASCII grid for visual inspection */
        function buildGridVisual(config) {
            const { size, words } = config;
            const grid = Array.from({ length: size }, () => Array(size).fill('·'));
            const nums = {};
            words.forEach(w => {
                getCells(w).forEach(({ row, col, char }) => { grid[row][col] = char; });
                const key = `${w.r}-${w.c}`;
                if (!nums[key]) nums[key] = w.num;
            });
            let out = '    ' + Array.from({ length: size }, (_, i) => String(i).padStart(2)).join('') + '\n';
            for (let r = 0; r < size; r++) {
                out += String(r).padStart(2) + '  ' + grid[r].map(c => c === '·' ? ' ·' : ' ' + c).join('') + '\n';
            }
            return out;
        }

        // ── Run all tests ──
        const resultsEl = document.getElementById('results');
        const summaryEl = document.getElementById('summary');
        let totalPass = 0, totalFail = 0;

        for (const [pageName, config] of Object.entries(puzzles)) {
            const tests = [
                { label: 'All words fit within grid bounds', fn: testBounds },
                { label: 'No letter conflicts at intersections', fn: testNoConflicts },
                { label: 'All words are connected (no isolated words)', fn: testAllConnected },
                { label: 'No unintended adjacency (clean grid runs)', fn: testNoUnintendedAdjacency },
                { label: 'Unique clue numbers', fn: testUniqueNumbers },
                { label: 'Clue number ordering (top→bottom, left→right)', fn: testNumberOrder },
            ];

            let sectionPass = true;
            const rows = tests.map(t => {
                const result = t.fn(pageName, config);
                if (result.passed) { totalPass++; }
                else { totalFail++; sectionPass = false; }
                return `
                    <div class="test-row">
                        <span class="badge ${result.passed ? 'pass' : 'fail'}">${result.passed ? '✓' : '✗'}</span>
                        <span>${t.label}</span>
                        <span class="detail">${result.message}</span>
                    </div>`;
            });

            resultsEl.innerHTML += `
                <div class="puzzle-section">
                    <div class="puzzle-header ${sectionPass ? 'all-pass' : 'has-fail'}">
                        ${sectionPass ? '✓' : '✗'} ${pageName}
                    </div>
                    ${rows.join('')}
                    <div class="grid-visual"><pre>${buildGridVisual(config)}</pre></div>
                </div>`;
        }

        summaryEl.className = 'summary ' + (totalFail === 0 ? 'all-pass' : 'has-fail');
        summaryEl.textContent = totalFail === 0
            ? `All ${totalPass} tests passed across ${Object.keys(puzzles).length} puzzles`
            : `${totalPass} passed, ${totalFail} failed across ${Object.keys(puzzles).length} puzzles`;
    </script>
</body>
</html>
